; PHP limits for Hostinger (read by PHP-FPM/LiteSpeed from public_html, applies to api/ too).
; Resumes are capped at 15 MB in api/applicants.php; the request limit leaves room for the form
; fields, so an oversized file reaches the script and gets a clean "max 15MB" JSON error instead
; of PHP dropping the body. Shipped by tools/deploy-hostinger.mjs; .htaccess denies dotfiles.
upload_max_filesize = 16M
post_max_size = 20M
