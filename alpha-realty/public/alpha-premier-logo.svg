<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <!-- Ultra-realistic Metallic Gold Gradient -->
    <linearGradient id="gold-metallic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bfa353" />
      <stop offset="20%" stop-color="#fdf0a6" />
      <stop offset="40%" stop-color="#dfba61" />
      <stop offset="60%" stop-color="#a38237" />
      <stop offset="80%" stop-color="#f3e5bd" />
      <stop offset="100%" stop-color="#bfa353" />
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2c474" />
      <stop offset="50%" stop-color="#fff2b2" />
      <stop offset="100%" stop-color="#d3ad4d" />
    </linearGradient>

    <!-- Subtle Drop Shadow / Glow -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#subtle-glow)">
    <!-- 1. THE GOLD DOUBLE-CHEVRON EMBLEM -->
    <!-- Left Outer Leg -->
    <polygon points="236,22 250,22 138,186 118,186" fill="url(#gold-metallic)" />
    <!-- Right Outer Leg -->
    <polygon points="264,22 250,22 362,186 382,186" fill="url(#gold-metallic)" />

    <!-- Left Middle Leg -->
    <polygon points="237,54 250,54 165,186 147,186" fill="url(#gold-metallic)" />
    <!-- Right Middle Leg -->
    <polygon points="263,54 250,54 335,186 353,186" fill="url(#gold-metallic)" />

    <!-- Left Inner Leg -->
    <polygon points="238,86 250,86 191,186 175,186" fill="url(#gold-metallic)" />
    <!-- Right Inner Leg -->
    <polygon points="262,86 250,86 309,186 325,186" fill="url(#gold-metallic)" />

    <!-- Center Tiny Roof Gable -->
    <polygon points="250,132 268,160 258,160 250,148 242,160 232,160" fill="url(#gold-metallic)" />

    <!-- 4 Small Gold Window Squares (2x2 Grid) -->
    <rect x="243" y="166" width="5.5" height="5.5" rx="1" fill="url(#gold-metallic)" />
    <rect x="251.5" y="166" width="5.5" height="5.5" rx="1" fill="url(#gold-metallic)" />
    <rect x="243" y="174" width="5.5" height="5.5" rx="1" fill="url(#gold-metallic)" />
    <rect x="251.5" y="174" width="5.5" height="5.5" rx="1" fill="url(#gold-metallic)" />

    <!-- 2. "ALPHAPREMIER" TEXT (White Outlined / Hollow) -->
    <text 
      x="250" 
      y="228" 
      text-anchor="middle" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="1.3" 
      stroke-linejoin="round"
      font-family="'Orbitron', 'Cinzel', 'Eurostile', 'Montserrat', system-ui, -apple-system, sans-serif" 
      font-weight="400" 
      font-size="34" 
      letter-spacing="9"
      style="letter-spacing: 0.28em;"
    >
      ALPHAPREMIER
    </text>

    <!-- 3. GOLD DIVIDER LINE & "REALTY" TEXT -->
    <!-- Left Circle & Line -->
    <circle cx="75" cy="262" r="4.5" fill="url(#gold-metallic)" />
    <line x1="82" y1="262" x2="182" y2="262" stroke="url(#gold-metallic)" stroke-width="2.2" />

    <!-- "REALTY" Text -->
    <text 
      x="250" 
      y="268" 
      text-anchor="middle" 
      fill="url(#gold-bright)" 
      font-family="'Orbitron', 'Cinzel', 'Eurostile', 'Montserrat', system-ui, -apple-system, sans-serif" 
      font-weight="300" 
      font-size="18" 
      letter-spacing="10"
      style="letter-spacing: 0.45em;"
    >
      REALTY
    </text>

    <!-- Right Line & Circle -->
    <line x1="318" y1="262" x2="418" y2="262" stroke="url(#gold-metallic)" stroke-width="2.2" />
    <circle cx="425" cy="262" r="4.5" fill="url(#gold-metallic)" />
  </g>
</svg>
