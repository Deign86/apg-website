name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Application (Vite)
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json

      - name: Lint PHP Backend Files
        run: |
          find api -type f -name "*.php" -exec php -l {} +

      - name: Chat takeover E2E
        run: |
          php -S localhost:8000 -t . > /tmp/chat-takeover-php.log 2>&1 &
          PHP_SERVER_PID=$!
          trap 'kill "$PHP_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent http://localhost:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/chat-takeover.e2e.mjs
